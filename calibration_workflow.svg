<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 850" width="100%" height="100%" style="background-color: white; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Subtle shadow for boxes -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1" flood-color="#000000"/>
    </filter>
    
    <!-- Arrowheads -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4B5563"/>
    </marker>
    <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0EA5E9"/>
    </marker>
  </defs>

  <!-- ================= USER BOX ================= -->
  <rect x="225" y="40" width="300" height="75" rx="8" fill="#FFF9C4" stroke="#FBC02D" stroke-width="2" filter="url(#shadow)"/>
  <text x="375" y="65" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F2937">🧑‍💻 USER</text>
  <text x="375" y="90" font-size="14" text-anchor="middle" fill="#4B5563">Request: "Calibrate the occupancy schedule"</text>

  <!-- Arrow User to Agent -->
  <line x1="375" y1="115" x2="375" y2="160" stroke="#4B5563" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="385" y="145" font-size="12" fill="#4B5563">Natural Language Query</text>

  <!-- ================= AGENT BOX ================= -->
  <rect x="200" y="160" width="350" height="100" rx="8" fill="#E3F2FD" stroke="#42A5F5" stroke-width="2" filter="url(#shadow)"/>
  <text x="375" y="185" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F2937">🤖 READ AGENT</text>
  <text x="375" y="210" font-size="14" text-anchor="middle" fill="#4B5563">1. Parses intent &amp; discovers files</text>
  <text x="375" y="230" font-size="14" text-anchor="middle" fill="#4B5563">2. Selects appropriate MCP tool</text>
  <text x="375" y="250" font-size="14" text-anchor="middle" fill="#4B5563">3. Synthesizes final report</text>

  <!-- Arrow Agent to Tool -->
  <line x1="375" y1="260" x2="375" y2="310" stroke="#4B5563" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="385" y="275" width="140" height="20" fill="#FFFFFF"/>
  <text x="390" y="290" font-size="12" fill="#4B5563">Invoke Tool (IDF, CSV)</text>

  <!-- ================= epMCP BOX ================= -->
  <rect x="125" y="310" width="500" height="380" rx="8" fill="#F3E5F5" stroke="#AB47BC" stroke-width="2" filter="url(#shadow)"/>
  <text x="375" y="335" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F2937">epMCP Tools Server</text>

  <!-- Specific Tool Box -->
  <rect x="250" y="350" width="250" height="40" rx="6" fill="#FFFFFF" stroke="#AB47BC" stroke-width="2"/>
  <text x="375" y="375" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">🛠️ calibrate_occupancy_tool</text>

  <!-- Arrow down into loop -->
  <line x1="375" y1="390" x2="375" y2="420" stroke="#4B5563" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ================= LOOP BOX ================= -->
  <rect x="155" y="420" width="440" height="250" rx="8" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="170" y="440" font-size="13" font-weight="bold" fill="#6B7280">Nelder-Mead Optimization Loop (Internal to Tool)</text>

  <!-- Loop Steps -->
  <rect x="205" y="460" width="240" height="40" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="325" y="485" font-size="14" text-anchor="middle" fill="#1F2937">1. Modify IDF Occupancy</text>

  <line x1="325" y1="500" x2="325" y2="530" stroke="#4B5563" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="205" y="530" width="240" height="40" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="325" y="555" font-size="14" text-anchor="middle" fill="#1F2937">2. Run EnergyPlus Simulation</text>

  <line x1="325" y1="570" x2="325" y2="600" stroke="#4B5563" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="205" y="600" width="240" height="40" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="325" y="625" font-size="14" text-anchor="middle" fill="#1F2937">3. Calculate RMSE vs Target</text>

  <!-- Loop Feedback Arrow -->
  <path d="M 445 620 L 535 620 L 535 480 L 450 480" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="470" y="525" width="125" height="50" fill="#FAFAFA"/>
  <text x="535" y="540" font-size="12" text-anchor="middle" fill="#6B7280">If RMSE ></text>
  <text x="535" y="555" font-size="12" text-anchor="middle" fill="#6B7280">Tolerance</text>
  <text x="535" y="570" font-size="12" font-style="italic" text-anchor="middle" fill="#6B7280">(Adjust Multiplier)</text>

  <!-- ================= RETURN TO AGENT ARROW ================= -->
  <!-- Starts from Tool box (left side) -> goes left -> goes up -> right -> Agent Box (left side) -->
  <path d="M 250 370 L 60 370 L 60 210 L 190 210" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="60" y="255" width="125" height="50" fill="#FFFFFF" fill-opacity="0.8"/>
  <text x="65" y="270" font-size="12" font-weight="bold" text-anchor="start" fill="#4B5563">Returns JSON:</text>
  <text x="65" y="285" font-size="12" text-anchor="start" fill="#4B5563">Optimal Multiplier,</text>
  <text x="65" y="300" font-size="12" text-anchor="start" fill="#4B5563">Final RMSE, Log</text>

  <!-- ================= SHARED RESOURCES ================= -->
  <!-- Arrow Tool down to Resources -->
  <line x1="375" y1="690" x2="375" y2="740" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-dashed)"/>
  <rect x="385" y="700" width="90" height="20" fill="#FFFFFF"/>
  <text x="390" y="715" font-size="12" fill="#0EA5E9">Reads / Writes</text>

  <rect x="225" y="740" width="300" height="75" rx="8" fill="#E1F5FE" stroke="#0284C7" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow)"/>
  <text x="375" y="765" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F2937">📁 SHARED RESOURCES</text>
  <text x="375" y="790" font-size="14" text-anchor="middle" fill="#4B5563">IDF Model, EPW Weather, Target CSV</text>
  
  <!-- ================= RETURN TO USER ARROW ================= -->
  <!-- Starts from Agent Box (right side) -> goes right -> goes up -> left -> User Box (right side) -->
  <path d="M 550 210 L 690 210 L 690 75 L 535 75" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="560" y="115" width="130" height="40" fill="#FFFFFF" fill-opacity="0.8"/>
  <text x="685" y="130" font-size="12" font-weight="bold" text-anchor="end" fill="#4B5563">Final Execution</text>
  <text x="685" y="145" font-size="12" text-anchor="end" fill="#4B5563">Summary &amp; Analysis</text>
</svg>
